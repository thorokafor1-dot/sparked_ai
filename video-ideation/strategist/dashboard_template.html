<title>Sparked Video Ideation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Color: warm violet-neutral ground, a confident garnet accent for rank/action, a separate
   muted gold that marks "top pick" tiers so it never fights the accent, and good/warn kept for
   evidence-strength semantics only, never reused as decoration. */
:root{
  --paper:#F5F1F5; --surface:#FFFFFF; --surface2:#ECE6EF; --ink:#1C1521; --ink2:#5B5266; --muted:#7C7286;
  --line:#E2DAE6; --accent:#B42A4C; --accent-ink:#FFFFFF; --accent-soft:#F7E3E8;
  --gold:#93641F; --gold-soft:#F3E7D2;
  --good:#1F7A5C; --good-soft:#DDF1E9; --warn:#96590A; --warn-soft:#F8EBD3;
  --shadow:0 1px 2px rgba(28,21,33,.05),0 10px 24px -8px rgba(28,21,33,.14);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#120F17; --surface:#1C1722; --surface2:#26202D; --ink:#F2ECF5; --ink2:#B7ADC2; --muted:#8B8195;
    --line:#332C3C; --accent:#F0748F; --accent-ink:#1B0F14; --accent-soft:#3A2129;
    --gold:#D9A857; --gold-soft:#3A2F17;
    --good:#52C39B; --good-soft:#17352A; --warn:#E0A44A; --warn-soft:#3A2D14;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 24px -8px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#120F17; --surface:#1C1722; --surface2:#26202D; --ink:#F2ECF5; --ink2:#B7ADC2; --muted:#8B8195;
  --line:#332C3C; --accent:#F0748F; --accent-ink:#1B0F14; --accent-soft:#3A2129;
  --gold:#D9A857; --gold-soft:#3A2F17;
  --good:#52C39B; --good-soft:#17352A; --warn:#E0A44A; --warn-soft:#3A2D14;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 24px -8px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:22px 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:26px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft);color:var(--ink)}

.top{display:flex;flex-direction:column;gap:6px;padding-bottom:2px;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:clamp(26px,5.5vw,36px);line-height:1;font-weight:800;padding-bottom:14px}
.sub{color:var(--ink2);margin:0 0 12px;font-size:14px;max-width:56ch}

/* Step 1: pick what you're making. Each group gets a colored rail, not just a caption, so the
   infield/video-chat/explainer split reads as structure, not a label. */
.group{display:flex;flex-direction:column;gap:10px}
.group-label{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.group-label i{width:14px;height:3px;background:var(--accent);border-radius:2px;flex:none}
.group:nth-of-type(2) .group-label i{background:var(--gold)}
.group:nth-of-type(3) .group-label i{background:var(--good)}
.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.picker.solo{grid-template-columns:1fr}
@media (max-width:480px){.picker{grid-template-columns:1fr}}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
.pick:hover{border-color:var(--accent);transform:translateY(-1px)}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.pick[aria-pressed="true"] .pick-name,.pick[aria-pressed="true"] .pick-best{color:var(--paper)}
.pick img{width:100%;height:132px;object-fit:cover;display:block;background:var(--surface2)}
.pick-text{display:flex;flex-direction:column;gap:4px;min-width:0;padding:10px 12px 12px}
.pick-name{font-family:var(--display);font-size:16px;font-weight:700}
.pick-best{color:var(--ink2);font-size:12.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pick[aria-pressed="true"] .pick-best{opacity:.75}
@media (prefers-reduced-motion:no-preference){.pick{transition:transform .12s ease, border-color .12s ease}}

/* Step 2: everything scoped to the chosen category */
.scope{display:none;flex-direction:column;gap:26px}
.scope.on{display:flex}
.switcher{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
.switcher-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.switcher-group + .switcher-group{padding-left:14px;border-left:1px solid var(--line)}
.chip{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:17px;display:flex;align-items:center;gap:9px}
.section h2::before{content:"";width:4px;height:16px;background:var(--accent);border-radius:2px}
.section .hint{color:var(--muted);margin:0;font-size:12.5px}

.fmt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.fmt-row{display:flex;gap:11px}
.fmt-thumb{width:92px;height:52px;object-fit:cover;border-radius:8px;flex:none;background:var(--surface2);display:block}
.fmt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.fmt-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fmt-name{font-weight:700;font-size:14px}
.fmt-score{font-family:var(--mono);font-size:12px;color:var(--good);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500}
.fmt-score.thin{color:var(--muted)}
.fmt-bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.fmt-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.fmt-bar i.thin{background:var(--muted);opacity:.45}
.fmt-ex{color:var(--muted);font-size:12px}
.fmt-ex a{color:inherit}
.fmt-also{color:var(--muted);font-size:11px;font-family:var(--mono)}
.fmt-thumbnote{background:var(--gold-soft);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:12.5px;line-height:1.4}
.fmt-thumbnote b{color:var(--gold);font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.fmt-use{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 8px;font-size:10.5px;color:var(--ink2);font-weight:500}
.fmt-use:hover{border-color:var(--accent);color:var(--ink)}
.fmt-list{display:grid;gap:9px}

.idea{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.idea.p1{border-left-color:var(--gold)}
.idea-head{width:100%;display:flex;align-items:center;gap:11px;padding:11px 14px;text-align:left;background:none;border:0;list-style:none;cursor:pointer}
.idea-head:hover{background:var(--surface2)}
.idea-head::-webkit-details-marker{display:none}
.idea-head::marker{content:""}
.idea-thumb{width:68px;height:38px;object-fit:cover;border-radius:7px;flex:none;background:var(--surface2)}
.rank{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--muted);min-width:22px;font-variant-numeric:tabular-nums}
.rank.r1{color:var(--gold)}
.idea-title{flex:1;font-family:var(--display);font-size:15px;line-height:1.3;font-weight:700}
.pot{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--ink2);white-space:nowrap;font-weight:600}
.pot.p1{background:var(--gold-soft);color:var(--gold)}
.chev{font-size:12px;color:var(--muted);transition:transform .15s}
.idea[open] .chev{transform:rotate(90deg)}
.idea-body{padding:0 14px 16px;display:flex;flex-direction:column;gap:13px;border-top:1px solid var(--line);padding-top:13px}
.idea-body .strength{font-size:12px;color:var(--muted)}
.idea-body .why{margin:0;color:var(--ink);font-size:14px}
.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.ev{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;min-width:0}
.ev img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--surface2);display:block}
.ev .stat{font-family:var(--mono);font-size:11px;color:var(--good);font-weight:600;font-variant-numeric:tabular-nums}
.ev .who{font-size:11px;color:var(--ink2);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
dl{display:grid;gap:11px;margin:0}
dt{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;font-weight:600}
dd{margin:0;color:var(--ink);font-size:14px}
.prompt{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.copy{margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600}
.copy:hover{border-color:var(--accent)}
.copy.done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.star{margin-left:4px;border:1px solid var(--line);background:transparent;border-radius:7px;width:32px;height:32px;font-size:16px;color:var(--muted);flex:none}
.star:hover{border-color:var(--accent);color:var(--accent)}
.star[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.star[aria-pressed="true"]:hover{color:var(--accent-ink)}

.foot{color:var(--muted);font-size:11.5px;max-width:70ch;padding-top:4px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.idea{transition:box-shadow .15s}.chip,.copy{transition:background .12s, border-color .12s}}
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow" id="eyebrow"></span>
    <h1>Sparked Video Ideation</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="picker" id="picker" role="group" aria-label="What are you making"></div>

  <div class="scope" id="scope">
    <div class="switcher" id="switcher" role="group" aria-label="Switch video type"></div>

    <div class="section">
      <h2>Formats that win for this type</h2>
      <p class="hint" id="fhint"></p>
      <div class="fmt-list" id="formats"></div>
    </div>

    <div class="section">
      <h2>Ideas, ranked by potential</h2>
      <div id="ideas"></div>
    </div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
const DATA = __DATA__;
const CATS = Object.keys(DATA.categories);
// Three different shoots with different formats, kept visually separate so picking one never
// surfaces another's ideas: in-person infield, video chat (a different medium, not infield),
// and explainer (talking-head, no approach footage at all).
const GROUPS = [
  {label:"Infield (in-person, raw footage)", cats:["daygame","bargame"].filter(c=>CATS.includes(c))},
  {label:"Video chat e-dates", cats:CATS.filter(c=>c==="video-chat-edates")},
  {label:"Explainer (talking-head)", cats:CATS.filter(c=>c==="explainer")},
].filter(g=>g.cats.length);
let cat = null;
let stars = new Set();
try{ stars = new Set(JSON.parse(localStorage.getItem("ideaDeskStars")||"[]")); }catch(e){}
function saveStars(){ try{ localStorage.setItem("ideaDeskStars", JSON.stringify([...stars])); }catch(e){} }
const fmtSubs = n => n==null?"":(n>=1e6?(n/1e6).toFixed(1).replace(".0","")+"M":n>=1e3?(n/1e3).toFixed(1).replace(".0","")+"K":String(n))+" subs";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.getElementById("eyebrow").textContent = "Cold approach · video strategy · updated " + DATA.generated;
document.getElementById("sub").textContent = "Pick what you're filming, see only the formats and ideas that fit it.";
document.getElementById("foot").textContent = DATA.footnote;

function topIdea(c){ return DATA.categories[c].ideas.slice().sort((a,b)=>a.rank-b.rank)[0]; }
function bestEvidence(i){ return i.evidence.slice().sort((a,b)=>(b.score||0)-(a.score||0))[0]; }
function pickCard(c){
  const t = topIdea(c), ev = bestEvidence(t);
  return '<button class="pick" data-pick="'+c+'" aria-pressed="'+(cat===c)+'">'
    +'<img src="thumbs/'+esc(ev.vid)+'.jpg" alt="">'
    +'<span class="pick-text"><span class="pick-name">'+esc(DATA.categories[c].label)+'</span>'
    +'<span class="pick-best">#1: '+esc(t.title)+'</span></span></button>';
}
function renderPicker(){
  document.getElementById("picker").outerHTML = '<div id="picker">'+GROUPS.map(g=>
    '<div class="group"><div class="group-label">'+esc(g.label)+'</div>'
    +'<div class="picker'+(g.cats.length<2?' solo':'')+'">'+g.cats.map(pickCard).join("")+'</div></div>'
  ).join("")+'</div>';
}
function renderSwitcher(){
  document.getElementById("switcher").innerHTML = GROUPS.map(g=>
    '<div class="switcher-group">'+g.cats.map(c=>
      '<button class="chip" data-pick="'+c+'" aria-pressed="'+(cat===c)+'">'+esc(DATA.categories[c].label)+'</button>'
    ).join("")+'</div>'
  ).join("");
}
function fmtRow(f){
  const uses = f.ideas.map(x=>'<button class="fmt-use" data-jump="'+esc(x.id)+'">#'+x.rank+' '+esc(x.title.slice(0,24))+(x.title.length>24?'…':'')+'</button>').join("");
  const pct = f._pct;
  return '<div class="fmt"><div class="fmt-row">'
   +'<a href="'+esc(f.best_url)+'" target="_blank" rel="noopener" title="'+esc(f.best_title)+'"><img class="fmt-thumb" loading="lazy" src="thumbs/'+esc(f.best_vid)+'.jpg" alt=""></a>'
   +'<div class="fmt-main">'
   +'<div class="fmt-top"><span class="fmt-name">'+esc(f.label)+'</span><span class="fmt-score'+(f.thin?' thin':'')+'">'+f.median+'x · '+f.n+' video'+(f.n===1?'':'s')+'</span></div>'
   +'<div class="fmt-bar"><i class="'+(f.thin?'thin':'')+'" style="width:'+pct+'%"></i></div>'
   +'<div class="fmt-ex"><a href="'+esc(f.best_url)+'" target="_blank" rel="noopener">Best: "'+esc(f.best_title)+'" ('+f.best_score+'x)'+(f.thin?", only "+f.n+" tracked, not proven":"")+'</a></div>'
   +'</div></div>'
   +(f.thumb_note?'<div class="fmt-thumbnote"><b>Thumbnail:</b> '+esc(f.thumb_note)+'</div>':'')
   +(f.also.length?'<div class="fmt-also">Also wins in: '+f.also.map(esc).join(", ")+'</div>':'')
   +(uses?'<div class="fmt-ex" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:2px">'+uses+'</div>':'')
   +'</div>';
}
function renderFormats(){
  const b = DATA.formats[cat];
  document.getElementById("fhint").textContent = b.videos + " tracked " + b.label.toLowerCase() + " videos, typical score " + b.median + "x. A thin bar means only a few tracked videos, a lead not proof.";
  const maxMed = Math.max(...b.formats.filter(x=>!x.thin).map(x=>x.median), 1);
  b.formats.forEach(f=> f._pct = Math.max(4, Math.min(100, Math.round(f.median/maxMed*100))));
  document.getElementById("formats").innerHTML = b.formats.map(fmtRow).join("");
}
function ideaCard(i){
  const st = stars.has(i.id);
  const top = bestEvidence(i);
  const ev = i.evidence.map(e=>'<a class="ev" href="'+esc(e.url)+'" target="_blank" rel="noopener"><img loading="lazy" src="thumbs/'+esc(e.vid)+'.jpg" alt=""><span class="stat">'+esc(e.stat)+(e.views?' · '+esc(e.views):'')+(e.subs?' · '+fmtSubs(e.subs):'')+'</span><span class="who">'+esc(e.channel)+': '+esc(e.title)+'</span></a>').join("");
  return '<details class="idea'+(i.rank<=3?' p1':'')+'" data-id="'+esc(i.id)+'">'
   +'<summary class="idea-head"><img class="idea-thumb" loading="lazy" src="thumbs/'+esc(top.vid)+'.jpg" alt=""><span class="rank'+(i.rank===1?' r1':'')+'">#'+i.rank+'</span><span class="idea-title">'+esc(i.title)+'</span>'
   +'<span class="pot'+(i.rank<=3?' p1':'')+'">'+esc(i.potential)+'</span>'
   +'<button class="star" data-star="'+esc(i.id)+'" aria-pressed="'+st+'" aria-label="Shortlist" title="Shortlist">'+(st?"★":"☆")+'</button><span class="chev">▸</span></summary>'
   +'<div class="idea-body">'
   +'<div class="strength">'+(i.strength==="proven"?"Proven in this niche":"Adapted from another niche")+'. '+esc(i.rank_reason)+'</div>'
   +'<p class="why">'+esc(i.why)+'</p>'
   +'<div class="evidence">'+ev+'</div>'
   +'<dl>'
   +'<div><dt>Say this</dt><dd>'+esc(i.hook)+'</dd></div>'
   +'<div><dt>Thumbnail</dt><dd>'+esc(i.thumbnail)+'</dd></div>'
   +'<div><dt>Grok prompt</dt><dd><div class="prompt" id="p-'+esc(i.id)+'">'+esc(i.prompt)+'</div><button class="copy" data-copy="p-'+esc(i.id)+'">Copy prompt</button></dd></div>'
   +'<div><dt>Footage needed</dt><dd>'+esc(i.footage)+'</dd></div>'
   +'<div><dt>Watch out for</dt><dd>'+esc(i.risk)+'</dd></div>'
   +'</dl></div></details>';
}
function renderIdeas(){
  const list = DATA.categories[cat].ideas.slice().sort((a,b)=>a.rank-b.rank);
  document.getElementById("ideas").innerHTML = list.map(ideaCard).join("");
}
function select(c){
  cat = c;
  renderPicker(); renderSwitcher();
  document.getElementById("scope").classList.toggle("on", !!cat);
  if(cat){ renderFormats(); renderIdeas(); document.getElementById("scope").scrollIntoView({behavior:"smooth", block:"start"}); }
}
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.pick){ select(t.dataset.pick); return; }
  if(t.dataset.star){
    const id=t.dataset.star; stars.has(id)?stars.delete(id):stars.add(id); saveStars();
    t.textContent = stars.has(id)?"★":"☆"; t.setAttribute("aria-pressed", stars.has(id));
    return;
  }
  if(t.dataset.jump){
    const el = document.querySelector('.idea[data-id="'+t.dataset.jump+'"]');
    if(el){ el.open = true; el.scrollIntoView({behavior:"smooth", block:"center"}); el.style.outline="2px solid var(--accent)"; setTimeout(()=>el.style.outline="",1400); }
    return;
  }
  if(t.dataset.copy){
    const el=document.getElementById(t.dataset.copy); const text=el.textContent;
    const done=()=>{t.textContent="Copied"; t.classList.add("done"); setTimeout(()=>{t.textContent="Copy prompt"; t.classList.remove("done");},1600);};
    const fallback=()=>{const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent="Selected, press Ctrl+C";};
    try{ navigator.clipboard.writeText(text).then(done,fallback); }catch(err){ fallback(); }
  }
});
renderPicker();
</script>
