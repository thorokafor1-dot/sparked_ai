name: YouTube outlier tracker

on:
  workflow_dispatch:
  schedule:
    # 8AM Central (CDT, UTC-5) every Wednesday. During CST (UTC-6, roughly
    # Nov-Mar) this actually fires at 7AM Central since cron has no DST.
    - cron: '0 13 * * 3'

jobs:
  scan-outliers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate outlier data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # YOUTUBE_KEYWORDS intentionally omitted so this falls through to the
          # widened default keyword list in common.py — a hardcoded
          # 13-term override here silently discarded every later widening of
          # that default (13 -> 48 -> 71 terms never actually ran).
          LOOKBACK_DAYS: '200'
          SHORTS_LOOKBACK_DAYS: '180'
        run: python outlier-tracking/youtube_outliers.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outlier-tracking/*/data.json
          git diff --cached --quiet || git commit -m "Update niche outlier data [skip ci]"
          git push
