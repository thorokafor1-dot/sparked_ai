name: General shorts finder

on:
  workflow_dispatch:
  # No schedule: this is the manual-discovery tool (prints SHORTCANDIDATE log
  # lines for a human/Claude to review by hand). curate_general_with_claude.py,
  # run via general_outlier_curation.yml, is the automated weekly path now.

jobs:
  find-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan for ultra-viral cross-niche shorts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python outlier-tracking/general-short-form/general_shorts_finder.py
