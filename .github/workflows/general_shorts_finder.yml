name: General shorts finder

on:
  workflow_dispatch:
  schedule:
    # 8AM Central (CDT, UTC-5) every Wednesday. During CST (UTC-6, roughly
    # Nov-Mar) this actually fires at 7AM Central since cron has no DST.
    - cron: '0 13 * * 3'

jobs:
  find-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan for ultra-viral cross-niche shorts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python outlier-tracking/general-short-form/general_shorts_finder.py
