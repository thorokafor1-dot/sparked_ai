name: General shorts swipe file

on:
  workflow_dispatch:

jobs:
  write-swipe-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write General Short Form Outliers data
        run: python outlier-tracking/general-short-form/general_shorts_swipe_file.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outlier-tracking/general-short-form/data.json
          git diff --cached --quiet || git commit -m "Update general short form outlier data [skip ci]"
          git push
